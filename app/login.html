<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmeldung – xtream-strm-gui</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --line: #2b3242;
      --text: #f1f5f9;
      --muted: #9aa4b2;
      --accent: #4f8cff;
      --bad: #e03131;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
    }
    p {
      margin: 0 0 18px 0;
      color: var(--muted);
      font-size: 14px;
    }
    label {
      display: block;
      margin: 0 0 6px 0;
      font-size: 13px;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #1f2430;
      color: var(--text);
      margin-bottom: 14px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .error {
      background: rgba(224,49,49,0.12);
      border: 1px solid rgba(224,49,49,0.35);
      color: #ffb3b3;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>GUI Anmeldung</h1>
    <p>Die Oberfläche ist nur aus dem lokalen Netzwerk erreichbar.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <label for="username">Benutzername</label>
    <input id="username" name="username" type="text" autocomplete="username" required>

    <label for="password">Passwort</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Anmelden</button>

    <div class="hint">
      Standardmäßig: <strong>admin</strong> / <strong>admin123</strong><br>
      Änderbar über die Umgebungsvariablen <code>GUI_USERNAME</code>, <code>GUI_PASSWORD</code> und <code>GUI_SESSION_SECRET</code>.
    </div>
  </form>
</body>
</html>
