<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xtream-strm-gui</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --line: #2b3242;
      --text: #f1f5f9;
      --muted: #9aa4b2;
      --accent: #4f8cff;
      --good: #2fb344;
      --warn: #f59f00;
      --bad: #e03131;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    h1, h2, h3 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .panel h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }
    .row {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    label {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    input, select, textarea, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border: 0;
      font-weight: bold;
    }
    button.secondary { background: #394150; }
    button.warn { background: var(--warn); color: #111; }
    button.danger { background: var(--bad); }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .actions-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .info-item {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .info-item .k {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .info-item .v {
      font-size: 14px;
      font-weight: bold;
      word-break: break-word;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .picker {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .picker-head {
      padding: 10px 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
      font-weight: bold;
    }
    .picker-body {
      padding: 12px;
    }
    .list {
      max-height: 240px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: #11151d;
    }
    .list-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .list-item:last-child { border-bottom: none; }
    .small {
      font-size: 12px;
      color: var(--muted);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .stat {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .stat .n {
      font-size: 22px;
      font-weight: bold;
      margin-top: 6px;
    }
    .progress {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: #0b0d12;
      overflow: hidden;
      border: 1px solid var(--line);
      margin-bottom: 10px;
    }
    .progress > div {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }
    .logbox {
      max-height: 300px;
      overflow: auto;
      background: #0b0d12;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
    }
    .changes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .change-box {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    ul.compact {
      margin: 0;
      padding-left: 18px;
      max-height: 220px;
      overflow: auto;
    }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .actions-3, .actions { grid-template-columns: 1fr; }
      .changes { grid-template-columns: 1fr; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>xtream-strm-gui</h1>

    <div class="grid">
      <div>
        <div class="panel">
          <h2>Verbindung & Profil</h2>

          <div class="row">
            <div>
              <label>Profilname</label>
              <input id="profileName" placeholder="z. B. Mein IPTV Profil" />
            </div>
          </div>

          <div class="row">
            <div>
              <label>Base URL</label>
              <input id="baseUrl" placeholder="http://server:8080" />
            </div>
          </div>

          <div class="row-2">
            <div>
              <label>Benutzername</label>
              <input id="username" />
            </div>
            <div>
              <label>Passwort</label>
              <input id="password" type="password" />
            </div>
          </div>

          <div class="actions-3">
            <button id="btnTestConnection">Verbindung testen</button>
            <button id="btnLoadCatalog" class="secondary">Kategorien laden</button>
            <button id="btnSaveProfile" class="secondary">Profil speichern</button>
          </div>

          <div style="height:10px"></div>

          <div class="actions-3">
            <select id="profileSelect"></select>
            <button id="btnLoadProfile" class="secondary">Profil laden</button>
            <button id="btnDeleteProfile" class="danger">Profil löschen</button>
          </div>
        </div>

        <div class="panel">
          <h2>Account-Informationen</h2>
          <div id="accountInfo" class="info-grid"></div>
        </div>

        <div class="panel">
          <h2>Ausgabe & Sync</h2>

          <div class="row">
            <div>
              <label>Root-Verzeichnis</label>
              <input id="rootDir" value="/output" />
            </div>
          </div>

          <div class="row-2">
            <div>
              <label>Movies-Ordner</label>
              <input id="moviesDir" value="Movies" />
            </div>
            <div>
              <label>Series-Ordner</label>
              <input id="seriesDir" value="Series" />
            </div>
          </div>

          <div class="row">
            <div>
              <label>LiveTV M3U-Datei</label>
              <input id="livetvFile" value="livetv.m3u" />
            </div>
          </div>

          <div class="row">
            <label><input type="checkbox" id="deleteRemoved" checked style="width:auto; margin-right:8px;"> Veraltete Dateien automatisch löschen</label>
          </div>

          <div class="actions">
            <button id="btnStartExport">Export starten</button>
            <button id="btnResetOutput" class="warn">Erzeugte Daten löschen</button>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>Kategorien</h2>

          <div class="picker">
            <div class="picker-head">LiveTV Kategorien</div>
            <div class="picker-body">
              <div class="row-2">
                <input id="searchLive" placeholder="Suchen..." />
                <div class="actions">
                  <button id="btnSelectAllLive" class="secondary">Alle</button>
                  <button id="btnSelectNoneLive" class="secondary">Keine</button>
                </div>
              </div>
              <div id="liveList" class="list"></div>
              <div class="small" id="liveSelectedCount">0 ausgewählt</div>
            </div>
          </div>

          <div class="picker">
            <div class="picker-head">Film Kategorien</div>
            <div class="picker-body">
              <div class="row-2">
                <input id="searchMovies" placeholder="Suchen..." />
                <div class="actions">
                  <button id="btnSelectAllMovies" class="secondary">Alle</button>
                  <button id="btnSelectNoneMovies" class="secondary">Keine</button>
                </div>
              </div>
              <div id="movieList" class="list"></div>
              <div class="small" id="movieSelectedCount">0 ausgewählt</div>
            </div>
          </div>

          <div class="picker">
            <div class="picker-head">Serien Kategorien</div>
            <div class="picker-body">
              <div class="row-2">
                <input id="searchSeries" placeholder="Suchen..." />
                <div class="actions">
                  <button id="btnSelectAllSeries" class="secondary">Alle</button>
                  <button id="btnSelectNoneSeries" class="secondary">Keine</button>
                </div>
              </div>
              <div id="seriesList" class="list"></div>
              <div class="small" id="seriesSelectedCount">0 ausgewählt</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>Status</h2>
          <div class="progress"><div id="progressBar"></div></div>
          <div id="statusText" class="small">Bereit.</div>
          <div style="height:10px"></div>
          <div id="logBox" class="logbox"></div>
        </div>

        <div class="panel">
          <h2>Zusammenfassung letzter Lauf</h2>
          <div id="summaryStats" class="stat-grid"></div>
        </div>

        <div class="panel">
          <div class="section-title">
            <h2 style="margin:0">Changelog zum vorherigen Lauf</h2>
            <button id="btnClearReport" class="secondary" style="width:auto">Report leeren</button>
          </div>
          <div class="changes">
            <div class="change-box">
              <h3>Neu hinzugefügt</h3>
              <ul id="addedList" class="compact"></ul>
            </div>
            <div class="change-box">
              <h3>Gelöscht</h3>
              <ul id="removedList" class="compact"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
